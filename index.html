<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TTEUKKEUN · ¿Qué nivel de picante tienes hoy?</title>
  <meta name="description" content="Test de picante de TTEUKKEUN (뜨끈): descubre qué plato en ttukbaegi va contigo hoy. 오늘 내 기분에 딱 맞는 뚝배기 요리를 찾아보세요.">
  <meta name="theme-color" content="#FEF5F0">
  <meta property="og:title" content="TTEUKKEUN · ¿Qué nivel de picante tienes hoy?">
  <meta property="og:description" content="¡Descubre qué plato en ttukbaegi va contigo hoy!">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/fira-sans-condensed-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fira-sans-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-heat="none" data-screen="start">
  <a class="skip" href="#app">Saltar al contenido</a>

  <main id="app" tabindex="-1">

    <!-- ===================== 01 · START ===================== -->
    <section class="screen start" id="screen-start" aria-labelledby="start-title">
      <header class="brandbar">
        <div class="logo-slot" data-logo></div>
      </header>

      <div class="start-grid">
        <div class="start-visual" data-hero-pot aria-hidden="true"></div>

        <div class="start-copy">
          <h1 class="start-title" id="start-title">¿Qué nivel de picante tienes hoy?</h1>
          <p class="start-title-ko" lang="ko" data-ko>오늘의 매움지수는?</p>

          <p class="start-sub">¡Descubre qué plato en ttukbaegi va contigo hoy!</p>
          <p class="start-sub-ko" lang="ko" data-ko>오늘 내 기분에 딱 맞는 뚝배기 요리를 찾아보세요!</p>

          <div class="start-actions">
            <a class="btn btn-primary" href="#/test/1" data-start>
              <span class="btn-label">EMPEZAR</span>
              <span class="btn-sub" lang="ko" data-ko>테스트 시작하기</span>
              <svg class="icon btn-arrow" aria-hidden="true"><use href="#i-arrow-r"/></svg>
            </a>
            <p class="start-meta">
              <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
              <span>5 preguntas · 1 minuto</span>
              <span class="start-meta-ko" lang="ko" data-ko>5문항 · 약 1분</span>
            </p>
          </div>
        </div>
      </div>

      <footer class="signoff">
        <span>TTEUKKEUN</span> — ¡Que hierva el sabor!
      </footer>
    </section>

    <!-- ===================== 02 · QUIZ ===================== -->
    <section class="screen quiz" id="screen-quiz" hidden aria-label="Test de picante">
      <div class="quiz-card">
        <div class="quiz-top">
          <span class="quiz-count" data-count aria-hidden="true">01 / 05</span>
        </div>
        <div class="thermo" role="progressbar" aria-label="Progreso del test" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" data-progress>
          <span class="thermo-fill" data-progress-fill></span>
          <span class="thermo-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        </div>

        <div class="q-stage" data-stage aria-live="polite"></div>

        <button class="back" type="button" data-back>
          <svg class="icon" aria-hidden="true"><use href="#i-arrow-l"/></svg>
          <span>volver</span>
        </button>
      </div>

      <div class="quiz-mascot" data-mascot aria-hidden="true"></div>
    </section>

    <!-- ===================== 03 · RESULT ===================== -->
    <section class="screen result" id="screen-result" hidden aria-labelledby="result-title"></section>

    <!-- ===================== 04 · RECIPE ===================== -->
    <section class="screen recipe" id="screen-recipe" hidden aria-labelledby="recipe-title"></section>

  </main>

  <!-- Icon system: one stroke weight, drawn for this brand -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-arrow-r" viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-arrow-l" viewBox="0 0 24 24"><path d="M20 12H5M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M10 2.5h4"/></g></symbol>
      <symbol id="i-bowl" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18c0 4.6-4 8.5-9 8.5S3 16.6 3 12Z"/><path d="M9 3.5c-1.2 1.6 1.2 2.6 0 4.5M14.5 3.5c-1.2 1.6 1.2 2.6 0 4.5"/></g></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.8 3.6 6.5 5.6 6.5 11.2A6.5 6.5 0 0 1 5.5 13.7c0-2.9 1.7-4.7 3-5.9.2 2 1.2 3.1 2.3 3.3-.2-3.1.2-5.8 1.2-8.6Z" fill="currentColor"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11a7.5 7.5 0 0 1 13.2-4.3L20 9M20 4v5h-5M19.5 13a7.5 7.5 0 0 1-13.2 4.3L4 15M4 20v-5h5"/></g></symbol>
      <symbol id="i-cup" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V8Z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16M9 3.5c-.8 1 .8 1.8 0 3M12.5 3.5c-.8 1 .8 1.8 0 3"/></g></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5.5-5 4 3.5 2.5-2 4 3.5"/></g></symbol>

      <pattern id="halftone" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
        <circle cx="3.5" cy="3.5" r="1.5" fill="#FEF5F0"/>
      </pattern>
      <pattern id="halftone-dark" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
        <circle cx="3" cy="3" r="1.2" fill="#331E11"/>
      </pattern>
    </defs>
  </svg>

  <noscript>
    <p class="noscript">Activa JavaScript para hacer el test. · 테스트를 하려면 JavaScript를 켜주세요.</p>
  </noscript>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
